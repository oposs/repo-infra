name: CI
# repo-infra: ci v2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # D28: Create release PR runs this same file on the release branch before
  # it opens the pull request. On push and pull_request `inputs.ref` is empty
  # and every checkout uses its default commit.
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:

  # repo-infra: ci-lib v2
  lib:
    name: Workflow library tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The release logic is a library, so it is tested like one. Before this,
      # the changelog roller was a Perl program inside a YAML string whose only
      # test was cutting a release.
      - name: Run the workflow library tests
        run: node --test .github/workflows/lib/*.test.js

  # repo-infra: ci-claude-plugin v2
  plugin-manifest:
    name: Plugin manifest is valid
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # No dependency and no plugin CLI: a malformed plugin.json is a JSON
      # parse away, and the marketplace resolves a plugin's version by reading
      # exactly these fields over anonymous HTTPS.
      - name: Check .claude-plugin/plugin.json
        run: |
          python3 - <<'PY'
          import json, re, sys
          data = json.load(open(".claude-plugin/plugin.json"))
          for field in ("name", "description", "version"):
              if not data.get(field):
                  sys.exit("plugin.json: %s is missing or empty" % field)
          if not re.fullmatch(r"\d+\.\d+\.\d+", data["version"]):
              sys.exit("plugin.json: version %r is not X.Y.Z" % data["version"])
          PY

  # repo-infra: ci-python v3
  ruff:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - run: pip install ruff

      - run: ruff check .

  pytest:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - run: pip install pytest

      # What a test suite needs to import is a toolchain concern, not an
      # infrastructure one (D15): the project declares it and this job only
      # honours the declaration. Same shape as ci-checkmk-plugin's step; a
      # repository with no such file gets a no-op.
      - name: Install the test dependencies the project declares
        run: |
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      # Import paths come from the pytest `pythonpath` setting, so this command
      # is the same in every python repository the standard installs into.
      - run: python3 -m pytest -q

  # repo-infra: ci-repo-infra-selftest v4
  repo-infra-selftest:
    name: Container self-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - run: pip install pytest

      # `-m container` filters *selection*, not *collection*: pytest imports
      # every module under tests/ before it decides which to run, so a test
      # file this job never runs can still stop it dead at import. That is how
      # this step came to exist -- the ordinary pytest job had the dependency
      # and this one did not, and the suite went from green to `1 error during
      # collection` on a file marked out of scope.
      - name: Install the test dependencies the project declares
        run: |
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      # The same fixed host toolchain `ci-perl-autotools` installs, and
      # deliberately the same string (D19). Podman on an Ubuntu runner is the
      # one link nothing else exercises, and this is the line that carries it.
      # A test pins the three blocks equal so they cannot drift apart silently.
      - name: Install the autotools host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake gettext podman

      # Only the container-marked tests. The ordinary `pytest` job already ran
      # everything else in under a second, and it did not need podman to do it.
      - run: python3 -m pytest -m container -v tests

  repo-infra-man:
    name: Man page toolchain tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - run: pip install pytest

      # pytest imports every module under tests/ before it selects any, so
      # this job needs the declared test dependencies like the one above.
      - name: Install the test dependencies the project declares
        run: |
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      # The packages ci-man installs, deliberately the same list (D23): these
      # tests prove the build assets that block runs. A test pins the two equal.
      - name: Install pandoc and the man toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc groff man-db

      # Only the pandoc-marked tests. The ordinary pytest job deselects them,
      # since ci-python installs no pandoc. CI is set on the runner, so a
      # missing tool fails these tests instead of skipping them.
      - run: python3 -m pytest -m pandoc -v tests

  # The single context the ruleset requires (spec D2). It exists so branch
  # protection can name one check that means "this repository's CI passed",
  # whatever this repository's jobs happen to be. The needs list is generated
  # by the assembler from the blocks that went into this file.
  #
  # `if: always()` is load-bearing. Without it this job is *skipped* when a
  # dependency fails, and a skipped job reports Success -- so the required
  # check would go green on a red build. It fails open, silently, and looks
  # like it is working.
  #
  # Release mode (D28): on a release pull request the test results do not
  # count. Create release PR tested exactly the head that carries the
  # release-built status, and the head must not be behind main. The verdict
  # is lib/release.js:releaseModeVerdict, loaded from the base commit, so a
  # release branch changed by accident cannot pass on library code it changed.
  ci-passed:
    if: always()
    needs: [lib, plugin-manifest, ruff, pytest, repo-infra-selftest, repo-infra-man]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    steps:
      - if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/')
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: repo-infra-base

      - if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/')
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - id: release
        name: Release mode
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/')
        uses: actions/github-script@v9
        with:
          script: |
            const lib = `${process.env.GITHUB_WORKSPACE}/repo-infra-base/.github/workflows/lib`;
            const releaseLib = require(`${lib}/release.js`);
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            // A fork's or a person's release/x gets the ordinary rules.
            if (!releaseLib.isReleasePr(pr, `${owner}/${repo}`)) {
              core.setOutput('mode', 'ordinary');
              return;
            }
            core.setOutput('mode', 'release');
            const statuses = await github.paginate(
              github.rest.repos.listCommitStatusesForRef,
              { owner, repo, ref: pr.head.sha, per_page: 100 },
            );
            const { data: compared } = await github.rest.repos.compareCommitsWithBasehead({
              owner, repo, basehead: `${pr.base.ref}...${pr.head.sha}`,
            });
            const verdict = releaseLib.releaseModeVerdict({
              statuses,
              behindBy: compared.behind_by,
              tag: releaseLib.releaseTag(pr.head.ref),
            });
            if (!verdict.ok) {
              core.setFailed(verdict.message);
              return;
            }
            core.notice(verdict.message);

      - if: steps.release.outputs.mode != 'release' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
        run: exit 1

  # D28: when main moves, every open release pull request is stale. The
  # ruleset's up-to-date rule already refuses its merge; this check run says
  # why, where GitHub alone offers the Update branch button. Push to main
  # only: when Create release PR calls this file the event is
  # workflow_dispatch and the job skips. It never fails: a failed job is a
  # failed check run on this main commit, and the guard of the next dispatch
  # would refuse it. An API error is a warning.
  release-pr-current:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Mark stale release pull requests
        uses: actions/github-script@v9
        with:
          script: |
            try {
              const releaseLib = require(
                `${process.env.GITHUB_WORKSPACE}/.github/workflows/lib/release.js`);
              const { owner, repo } = context.repo;
              const fullName = `${owner}/${repo}`;
              const prs = await github.paginate(github.rest.pulls.list, {
                owner, repo, state: 'open', per_page: 100,
              });
              const entries = [];
              for (const pr of prs.filter((p) => releaseLib.isReleasePr(p, fullName))) {
                const { data: compared } = await github.rest.repos.compareCommitsWithBasehead({
                  owner, repo, basehead: `${pr.base.ref}...${pr.head.sha}`,
                });
                entries.push({ pr, behindBy: compared.behind_by });
              }
              for (const stale of releaseLib.staleReleasePrs(entries, fullName)) {
                await github.rest.checks.create({
                  owner, repo, name: 'ci-passed', head_sha: stale.sha,
                  status: 'completed', conclusion: 'failure',
                  output: { title: stale.title, summary: stale.summary },
                });
                core.notice(`#${stale.number}: ${stale.summary}`);
              }
            } catch (error) {
              core.warning(`Could not mark stale release pull requests: ${error.message}`);
            }
