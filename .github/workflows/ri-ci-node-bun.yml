# repo-infra: ri-ci-node-bun v2
#
# Purpose: Install with bun, type-check and test.
# Choose: package.json and bun.lock, and no other lockfile.
# Supplies: A tsconfig for `bunx tsc --noEmit`, and tests for `bun test`.
# Call:
#   node:
#     uses: oposs/repo-infra/.github/workflows/ri-ci-node-bun.yml@v2
#     with:
#       ref: ${{ inputs.ref }}

name: Node (bun)

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to check out; empty takes the commit that triggered the run (D28).
        type: string
        required: false
        default: ''
      repository:
        description: The repository to check out; the calling repository unless set (D33).
        type: string
        required: false
        default: ${{ github.repository }}

permissions:
  contents: read

jobs:
  node-bun-check:
    name: Node checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bunx tsc --noEmit

      - run: bun test
