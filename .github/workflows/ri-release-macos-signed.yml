# repo-infra: ri-release-macos-signed v2
#
# Purpose: Run the project's build of a macOS installer package or disk image with the Developer ID certificates in a temporary keychain, then notarize, staple and check every file it wrote (D36).
# Choose: The project ships a Mac app or tool as a .pkg or .dmg (macos-signed in references/project-shape.md).
# Supplies: The command `build`, which signs with the Developer ID identities it finds in the keychain search list and writes the files `assets` names; the secrets MACOS_CERTS_P12, MACOS_CERTS_PASSWORD, NOTARY_KEY_P8, NOTARY_KEY_ID and NOTARY_ISSUER; the variable REQUIRE_SIGNED_RELEASES set to 1 once releases are signed.
# Produces: The artifact release-asset-macos with every file `assets` names; list them in release_assets.
# Call:
#   macos:
#     uses: oposs/repo-infra/.github/workflows/ri-release-macos-signed.yml@v2
#     with:
#       version: ${{ inputs.version }}
#       ref: ${{ inputs.ref }}
#       build: ./build.sh
#       assets: build/*.pkg
#     secrets:
#       MACOS_CERTS_P12: ${{ secrets.MACOS_CERTS_P12 }}
#       MACOS_CERTS_PASSWORD: ${{ secrets.MACOS_CERTS_PASSWORD }}
#       NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
#       NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
#       NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
#
# The build sees VERSION, MACOS_SIGNING (1 when the certificates are in the
# keychain, 0 for an unsigned build) and MACOS_TEAM_ID. It signs; the piece
# notarizes and staples, so the build needs no notarization credentials.

name: Build the signed macOS release

on:
  workflow_call:
    inputs:
      version:
        description: The version the release builds, from release-build.yml.
        type: string
        required: true
      ref:
        description: The release branch commit to build, from release-build.yml (D28).
        type: string
        required: true
      repository:
        description: The repository to check out; the calling repository unless set (D33).
        type: string
        required: false
        default: ${{ github.repository }}
      build:
        description: The command that builds and signs the release, run by bash in the checkout, for example ./build.sh or make dist.
        type: string
        required: true
      assets:
        description: Space-separated paths or globs of the .pkg and .dmg files the build writes, relative to the checkout.
        type: string
        required: true
      timeout_minutes:
        description: How long the job may run before it is cancelled; notarization alone can take 15 minutes.
        type: number
        required: false
        default: 60
    secrets:
      MACOS_CERTS_P12:
        description: Developer ID Application and Developer ID Installer with their private keys, exported together as one .p12, base64. Without it the build runs unsigned, unless REQUIRE_SIGNED_RELEASES is 1.
        required: false
      MACOS_CERTS_PASSWORD:
        description: The password of the .p12.
        required: false
      NOTARY_KEY_P8:
        description: The App Store Connect API key (.p8) notarytool signs in with.
        required: false
      NOTARY_KEY_ID:
        description: The key ID of that API key.
        required: false
      NOTARY_ISSUER:
        description: The issuer ID of the App Store Connect team.
        required: false

permissions:
  contents: read

jobs:
  macos:
    name: Build, sign and notarize
    runs-on: macos-26
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}

      # Every credential is tried here, before a build that can take many
      # minutes: Mountwell's first signed release failed twice after the build,
      # once on a mistyped .p12 password ("MAC verification failed during PKCS12
      # import (wrong password?)") and once on a wrong key ID ("HTTP status code:
      # 401. Unauthenticated").
      - name: Import the signing certificates
        id: certs
        env:
          MACOS_CERTS_P12: ${{ secrets.MACOS_CERTS_P12 }}
          MACOS_CERTS_PASSWORD: ${{ secrets.MACOS_CERTS_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          REQUIRE_SIGNED_RELEASES: ${{ vars.REQUIRE_SIGNED_RELEASES }}
        run: |
          set -euo pipefail
          if [ -z "$MACOS_CERTS_P12" ]; then
            # A lost or renamed secret must not ship a release every Mac
            # rejects; REQUIRE_SIGNED_RELEASES turns it into a failed build.
            if [ "$REQUIRE_SIGNED_RELEASES" = 1 ]; then
              echo "::error::REQUIRE_SIGNED_RELEASES is 1, but the secret MACOS_CERTS_P12 is empty or not passed to the piece"
              exit 1
            fi
            echo "::warning::MACOS_CERTS_P12 is not set; the release is built unsigned and Gatekeeper blocks it"
            echo "signed=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=()
          for name in MACOS_CERTS_PASSWORD NOTARY_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::MACOS_CERTS_P12 is set, but ${missing[*]} is empty or not passed to the piece"
            exit 1
          fi
          kc="$RUNNER_TEMP/signing.keychain-db"
          pw=$(uuidgen)
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          printf '%s' "$MACOS_CERTS_P12" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          if ! security import "$RUNNER_TEMP/certs.p12" -k "$kc" -P "$MACOS_CERTS_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/productsign; then
            echo "::error::the .p12 in MACOS_CERTS_P12 does not open with MACOS_CERTS_PASSWORD; test both with security import into a scratch keychain before gh secret set"
            exit 1
          fi
          rm "$RUNNER_TEMP/certs.p12"
          # Without the partition list codesign asks for the keychain password
          # in a dialog nobody can answer, and the job hangs to its timeout.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          app=$(security find-identity -v -p codesigning "$kc" \
            | sed -n 's/.*"Developer ID Application: .* (\([A-Z0-9]\{10\}\))"$/\1/p' | head -1)
          if [ -z "$app" ]; then
            echo "::error::MACOS_CERTS_P12 holds no Developer ID Application certificate with its private key"
            exit 1
          fi
          printf '%s' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          if ! xcrun notarytool history --key "$RUNNER_TEMP/notary.p8" \
              --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" >/dev/null; then
            echo "::error::notarytool does not accept NOTARY_KEY_P8 with NOTARY_KEY_ID and NOTARY_ISSUER; test them with xcrun notarytool history --key before gh secret set"
            exit 1
          fi
          {
            echo "signed=1"
            echo "team=$app"
          } >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          BUILD: ${{ inputs.build }}
          VERSION: ${{ inputs.version }}
          MACOS_SIGNING: ${{ steps.certs.outputs.signed }}
          MACOS_TEAM_ID: ${{ steps.certs.outputs.team }}
        run: eval "$BUILD"

      - name: Collect the assets
        env:
          ASSETS: ${{ inputs.assets }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p "$RUNNER_TEMP/dist"
          read -ra patterns <<< "${ASSETS//$'\n'/ }"
          found=0
          for pattern in "${patterns[@]}"; do
            matches=($pattern)
            if [ ${#matches[@]} -eq 0 ]; then
              echo "::error::assets names $pattern, but the build wrote no file there"
              exit 1
            fi
            for file in "${matches[@]}"; do
              case "$file" in
                *.pkg|*.dmg) ;;
                *)
                  echo "::error::$file is neither a .pkg nor a .dmg; the piece notarizes and staples only those"
                  exit 1
                  ;;
              esac
              cp "$file" "$RUNNER_TEMP/dist/"
              found=$((found + 1))
            done
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::assets names no file"
            exit 1
          fi

      - name: Notarize and staple
        if: steps.certs.outputs.signed == '1'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          notary=(--key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER")
          for file in "$RUNNER_TEMP"/dist/*; do
            out=$(xcrun notarytool submit "$file" "${notary[@]}" --wait --output-format json)
            status=$(jq -r .status <<< "$out")
            if [ "$status" != Accepted ]; then
              echo "::error::notarization of $(basename "$file") ended with $status"
              xcrun notarytool log "$(jq -r .id <<< "$out")" "${notary[@]}" || true
              exit 1
            fi
            xcrun stapler staple "$file"
          done

      # What a Mac checks on download, checked before anything is published:
      # a Developer ID of the team, Gatekeeper's verdict and the stapled ticket.
      - name: Check the signatures
        if: steps.certs.outputs.signed == '1'
        env:
          TEAM: ${{ steps.certs.outputs.team }}
        run: |
          set -euo pipefail
          for file in "$RUNNER_TEMP"/dist/*; do
            case "$file" in
              *.pkg)
                pkgutil --check-signature "$file" | tee "$RUNNER_TEMP/signature.txt"
                if ! grep -qE "1\. Developer ID Installer: .+ \($TEAM\)$" "$RUNNER_TEMP/signature.txt"; then
                  echo "::error::$(basename "$file") is not signed by a Developer ID Installer of team $TEAM"
                  exit 1
                fi
                spctl --assess --type install -vv "$file"
                ;;
              *.dmg)
                codesign --verify --strict --verbose=2 "$file"
                if ! codesign -dv "$file" 2>&1 | grep -qx "TeamIdentifier=$TEAM"; then
                  echo "::error::$(basename "$file") is not signed by team $TEAM"
                  exit 1
                fi
                spctl --assess --type open --context context:primary-signature -vv "$file"
                ;;
            esac
            xcrun stapler validate "$file"
          done

      # A fresh VM today, but on a self-hosted runner the key and the keychain
      # would outlive the job.
      - name: Remove the keychain and the notary key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/certs.p12"

      - uses: actions/upload-artifact@v7
        with:
          name: release-asset-macos
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
