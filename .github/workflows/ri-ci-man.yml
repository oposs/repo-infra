# repo-infra: ri-ci-man v2
#
# Purpose: Build the man page and fail on a roff warning.
# Choose: The project ships a man page built from docs/manual.md (D23).
# Supplies: docs/manual.md and a `man` target from build/man.mk.
# Pieces: man, man-lua
# Call:
#   man:
#     uses: oposs/repo-infra/.github/workflows/ri-ci-man.yml@v2
#     with:
#       ref: ${{ inputs.ref }}

name: Manual

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to check out; empty takes the commit that triggered the run (D28).
        type: string
        required: false
        default: ''
      repository:
        description: The repository to check out; the calling repository unless set (D33).
        type: string
        required: false
        default: ${{ github.repository }}

permissions:
  contents: read

jobs:
  man:
    name: Manual converts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}

      # pandoc converts the manual; man-db and groff-base render the result,
      # which is the only way to find out whether roff can lay the page out.
      # pandoc comes pinned from its GitHub release, not from the Ubuntu
      # mirror: on a slow Azure mirror the 27 MB package took longer than the
      # job's 10 minutes (#102). Bump PANDOC_VERSION and PANDOC_SHA256 together,
      # in every piece that carries this step; a test pins them equal.
      - name: Install pandoc
        env:
          PANDOC_VERSION: 3.12.1
          PANDOC_SHA256: b4217ac7c54067c442f9d4cd38bcd0c184a43f3e7053431a12263a6f92a33ba2
        run: |
          deb="$RUNNER_TEMP/pandoc-$PANDOC_VERSION-1-amd64.deb"
          curl -fsSL --retry 5 -o "$deb" \
            "https://github.com/jgm/pandoc/releases/download/$PANDOC_VERSION/pandoc-$PANDOC_VERSION-1-amd64.deb"
          echo "$PANDOC_SHA256  $deb" | sha256sum -c -
          sudo dpkg -i "$deb"

      # man-db, and groff-base with it, is on the runner image.
      - name: Install man-db where the image lacks it
        run: |
          if ! dpkg-query -W -f '${Status}' man-db 2>/dev/null | grep -qx 'install ok installed'; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends man-db
          fi

      - name: Build the man page
        run: make man

      # Nothing consumes the page in CI. This fails the pull request whose
      # manual stops converting, or converts into a page roff cannot lay out.
      # pandoc's preamble probes for the fonts C and CB and falls back when
      # they are missing; mdmost met both warnings on every build and neither
      # is a defect. The one that is, and that mdmost hit twice, is `table
      # wider than line length minus indentation`: a Markdown table with a
      # prose column. MANWIDTH pins the line length, since the runner has no
      # terminal to take it from.
      - name: Render every page and fail on a roff warning
        run: |
          shopt -s nullglob
          pages=(man/*.[1-9]*)
          if [ ${#pages[@]} -eq 0 ]; then
            echo "::error::make man produced no page under man/"
            exit 1
          fi
          status=0
          for page in "${pages[@]}"; do
            warnings=$(MANWIDTH=80 man --warnings -l "$page" 2>&1 >/dev/null \
              | grep -v -e "cannot select font 'C'$" -e "cannot select font 'CB'$" || true)
            if [ -n "$warnings" ]; then
              echo "::error file=$page::roff warnings in $page"
              printf '%s\n' "$warnings"
              status=1
            else
              echo "$page: no warnings"
            fi
          done
          exit $status
