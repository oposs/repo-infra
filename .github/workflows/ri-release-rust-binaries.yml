# repo-infra: ri-release-rust-binaries v2
#
# Purpose: Build the release archives of a Rust program for the seven native targets (D32), or for the ones `targets` names (D34).
# Choose: The project is a Rust program users install (native-targets in references/project-shape.md). Set `targets` only for a program that cannot build for every target, together with the exceptions D34 pairs with it: native-targets always, homebrew when a darwin or musl target is left out, linux-packages when a musl target is left out.
# Supplies: Cargo.toml whose package builds the one binary `bin` (a second one fails the build), README.md, LICENSE, and `make man` writing man/.
# Pieces: man, man-lua
# Produces: The artifacts release-asset-<target>, each holding <bin>-<version>-<target>.tar.gz (.zip on Windows, without man/), one per target built; list each of them in release_assets.
# Call:
#   binaries:
#     uses: oposs/repo-infra/.github/workflows/ri-release-rust-binaries.yml@v2
#     with:
#       version: ${{ inputs.version }}
#       ref: ${{ inputs.ref }}
#       bin: mytool

name: Build the Rust release archives

on:
  workflow_call:
    inputs:
      version:
        description: The version the release builds, from release-build.yml.
        type: string
        required: true
      ref:
        description: The release branch commit to build, from release-build.yml (D28).
        type: string
        required: true
      repository:
        description: The repository to check out; the calling repository unless set (D33).
        type: string
        required: false
        default: ${{ github.repository }}
      bin:
        description: The binary to build; the archives and their top folder are named after it.
        type: string
        required: true
      targets:
        description: Space-separated target triples to build (D34); all seven unless set. A name the piece does not build fails the run.
        type: string
        required: false
        default: x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-unknown-illumos x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-msvc aarch64-pc-windows-msvc

permissions:
  contents: read

jobs:
  man:
    name: Build the man pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}

      # The pages are built once, with the pandoc ri-ci-man checks them with,
      # and every archive of the release carries the same files. mtuspy's
      # single-file build ran pandoc from brew on macOS and from apt on Linux,
      # so one release would have shipped pages from two pandoc versions.
      - name: Install pandoc
        env:
          PANDOC_VERSION: 3.12.1
          PANDOC_SHA256: b4217ac7c54067c442f9d4cd38bcd0c184a43f3e7053431a12263a6f92a33ba2
        run: |
          deb="$RUNNER_TEMP/pandoc-$PANDOC_VERSION-1-amd64.deb"
          curl -fsSL --retry 5 -o "$deb" \
            "https://github.com/jgm/pandoc/releases/download/$PANDOC_VERSION/pandoc-$PANDOC_VERSION-1-amd64.deb"
          echo "$PANDOC_SHA256  $deb" | sha256sum -c -
          sudo dpkg -i "$deb"

      - name: Build the man pages
        run: make man

      - uses: actions/upload-artifact@v7
        with:
          name: man-pages
          path: man/
          if-no-files-found: error

  # The legs of every target the piece knows, cut down to the ones `targets`
  # names (D34). oxutrm needs a pty, fork and setsid and does not build for
  # Windows, so with a fixed matrix of seven its release could never pass.
  plan:
    name: Choose the targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Choose the targets
        id: plan
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          # illumos has no static C library, so the binary links the base
          # system's libraries. mtuspy's single-file build passed crt-static
          # there too.
          legs='[
            {"target": "x86_64-unknown-linux-musl", "os": "ubuntu-latest", "cross": true, "static": true},
            {"target": "aarch64-unknown-linux-musl", "os": "ubuntu-latest", "cross": true, "static": true},
            {"target": "x86_64-unknown-illumos", "os": "ubuntu-latest", "cross": true},
            {"target": "x86_64-apple-darwin", "os": "macos-latest"},
            {"target": "aarch64-apple-darwin", "os": "macos-latest"},
            {"target": "x86_64-pc-windows-msvc", "os": "windows-latest", "windows": true},
            {"target": "aarch64-pc-windows-msvc", "os": "windows-latest", "windows": true}
          ]'
          known=$(jq -r '[.[].target] | join(" ")' <<< "$legs")
          # A YAML block scalar in the caller puts one target per line; read
          # splits only the first line, so the newlines become blanks first.
          read -ra chosen <<< "${TARGETS//$'\n'/ }"
          if [ ${#chosen[@]} -eq 0 ]; then
            echo "::error::targets names no target; leave it out to build all of $known"
            exit 1
          fi
          unknown=()
          for target in "${chosen[@]}"; do
            case " $known " in
              *" $target "*) ;;
              *) unknown+=("$target") ;;
            esac
          done
          if [ ${#unknown[@]} -gt 0 ]; then
            echo "::error::targets names ${unknown[*]}, which this piece does not build; it builds $known"
            exit 1
          fi
          matrix=$(jq -c --arg chosen "${chosen[*]}" \
            '{include: [.[] | select(.target | IN($chosen | split(" ")[]))]}' <<< "$legs")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  binaries:
    name: Build ${{ matrix.target }}
    needs: [plan, man]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # One target failing must not cancel the others: which target broke is
      # the answer, and fail-fast throws the rest of it away.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Fetch the man pages
        if: ${{ !matrix.windows }}
        uses: actions/download-artifact@v8
        with:
          name: man-pages
          path: man

      # Pinned to a released version, as in ri-ci-rust-musl: a cross build is
      # not rehearsed locally, so it must not rest on a moving dependency.
      - name: Install cross
        if: ${{ matrix.cross }}
        run: cargo install cross --version 0.2.5 --locked

      # `--bin` builds the one binary. A crate with a second [[bin]] released
      # green without it: missing from every archive, package and formula,
      # with no warning. Binaries of other workspace members, an xtask for
      # example, are not part of the program and pass.
      - name: Refuse a package with a second binary
        shell: bash
        env:
          BIN: ${{ inputs.bin }}
        run: |
          set -euo pipefail
          others=$(cargo metadata --no-deps --format-version 1 | jq -r --arg bin "$BIN" '
            .packages[] | select(any(.targets[]; .name == $bin and (.kind | index("bin"))))
            | [.targets[] | select((.kind | index("bin")) and .name != $bin) | .name]
            | select(length > 0) | join(", ")')
          others=${others//$'\r'/}
          if [ -n "$others" ]; then
            echo "::error::the package of $BIN also builds $others; the archives, packages and formula carry $BIN alone, so move $others into another package"
            exit 1
          fi

      - name: Build
        shell: bash
        env:
          BIN: ${{ inputs.bin }}
          TARGET: ${{ matrix.target }}
          CROSS: ${{ matrix.cross }}
          STATIC: ${{ matrix.static }}
        run: |
          set -euo pipefail
          if [ "$STATIC" = true ]; then
            export RUSTFLAGS="-C target-feature=+crt-static"
          fi
          if [ "$CROSS" = true ]; then
            cross build --release --bin "$BIN" --target "$TARGET"
          else
            cargo build --release --bin "$BIN" --target "$TARGET"
          fi

      # The archive layout is the contract the packaging and Homebrew pieces
      # read (D32): <bin>/<bin>, <bin>/man/<every page>, README.md, LICENSE.
      # COPYFILE_DISABLE keeps the bsdtar of macOS from adding ._ files.
      - name: Pack the archive
        if: ${{ !matrix.windows }}
        shell: bash
        env:
          COPYFILE_DISABLE: 1
          BIN: ${{ inputs.bin }}
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          pages=(man/*.[1-9]*)
          if [ ${#pages[@]} -eq 0 ]; then
            echo "::error::no man page under man/; the man job uploads what make man built"
            exit 1
          fi
          mkdir -p dist "staging/$BIN/man"
          cp "target/$TARGET/release/$BIN" "staging/$BIN/"
          cp "${pages[@]}" "staging/$BIN/man/"
          cp README.md LICENSE "staging/$BIN/"
          tar -czf "dist/$BIN-$VERSION-$TARGET.tar.gz" -C staging "$BIN"

      # The same layout without man/. Compress-Archive, because the Windows
      # runner has no zip (mtuspy 0.1.2).
      - name: Pack the zip
        if: ${{ matrix.windows }}
        shell: pwsh
        env:
          BIN: ${{ inputs.bin }}
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          New-Item -ItemType Directory -Force -Path dist, "staging/${env:BIN}" | Out-Null
          Copy-Item "target/${env:TARGET}/release/${env:BIN}.exe" "staging/${env:BIN}/"
          Copy-Item README.md, LICENSE "staging/${env:BIN}/"
          Compress-Archive -Path "staging/${env:BIN}" -DestinationPath "dist/${env:BIN}-${env:VERSION}-${env:TARGET}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: release-asset-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
