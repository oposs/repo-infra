name: Gate (mtuspy)

# The release gate (D33). Create release PR dispatches it on branch
# gate/vX.Y.Z, a commit with the release head's tree (lib/gate.js says why),
# and waits for it; the release pull request does not open unless it
# succeeds. It runs mtuspy's CI and release-build jobs through ./, so the
# pieces and the library of the dispatched commit build the mtuspy release
# recorded in references/examples/mtuspy/source.json. Its artifacts stay in
# this run and never reach the release. It runs no publish piece and needs
# no secret. tests/test_gate.py holds its jobs equal to the example's.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Read the source record
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      repository: ${{ steps.read.outputs.repository }}
      ref: ${{ steps.read.outputs.ref }}
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: skills/repo-infra/references/examples/mtuspy

      - id: read
        run: |
          f=skills/repo-infra/references/examples/mtuspy/source.json
          for key in repository ref version; do
            value=$(jq -er ".$key" "$f")
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done

  rust:
    needs: source
    uses: ./.github/workflows/ri-ci-rust.yml
    with:
      repository: ${{ needs.source.outputs.repository }}
      ref: ${{ needs.source.outputs.ref }}

  rust-musl:
    needs: source
    uses: ./.github/workflows/ri-ci-rust-musl.yml
    with:
      repository: ${{ needs.source.outputs.repository }}
      ref: ${{ needs.source.outputs.ref }}

  man:
    needs: source
    uses: ./.github/workflows/ri-ci-man.yml
    with:
      repository: ${{ needs.source.outputs.repository }}
      ref: ${{ needs.source.outputs.ref }}

  binaries:
    needs: source
    uses: ./.github/workflows/ri-release-rust-binaries.yml
    with:
      version: ${{ needs.source.outputs.version }}
      repository: ${{ needs.source.outputs.repository }}
      ref: ${{ needs.source.outputs.ref }}
      bin: mtuspy

  packages:
    needs: [source, binaries]
    uses: ./.github/workflows/ri-release-nfpm.yml
    with:
      version: ${{ needs.source.outputs.version }}
      repository: ${{ needs.source.outputs.repository }}
      ref: ${{ needs.source.outputs.ref }}
      config: nfpm.yaml
      packagers: '{"deb": {}, "rpm": {}}'
      archives: x86_64-unknown-linux-musl aarch64-unknown-linux-musl

  homebrew:
    needs: [source, binaries]
    uses: ./.github/workflows/ri-release-homebrew.yml
    with:
      version: ${{ needs.source.outputs.version }}
      repository: ${{ needs.source.outputs.repository }}
      ref: ${{ needs.source.outputs.ref }}
      bin: mtuspy

  # PROOF ONLY, removed before merge: pour the retagged bottle through
  # brew's tag matching on the oldest and the newest arm64 runner.
  pour:
    needs: homebrew
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-asset-bottle-*
          path: bottles
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: rf
      - name: Pour through the tag match
        run: |
          set -euo pipefail
          sw_vers
          ls -l bottles
          sed -i '' "s|root_url \".*\"|root_url \"file://$PWD/bottles\"|" rf/Formula/mtuspy.rb
          sed -n '/BOTTLE-START/,/BOTTLE-END/p' rf/Formula/mtuspy.rb
          brew tap-new --no-git local/mtuspy
          cp rf/Formula/mtuspy.rb "$(brew --repository)/Library/Taps/local/homebrew-mtuspy/Formula/mtuspy.rb"
          major=$(brew --version | sed -n '1s/^Homebrew \([0-9][0-9]*\).*/\1/p')
          if [ "${major:-0}" -ge 6 ]; then brew trust --formula local/mtuspy/mtuspy; fi
          brew install local/mtuspy/mtuspy 2>&1 | tee install.log
          grep -q 'Pouring mtuspy-0.2.2.arm64_' install.log
          mtuspy --version
          otool -l "$(brew --prefix)/bin/mtuspy" | grep -A3 LC_BUILD_VERSION
