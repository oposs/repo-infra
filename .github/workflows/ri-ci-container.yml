# repo-infra: ri-ci-container v2
#
# Purpose: Run `make check` in the image the project's Containerfile builds (#94).
# Choose: The project includes build/container-make.mk.
# Supplies: A Containerfile and a Makefile that includes build/container-make.mk; `directory` when it is not at the top level; when the tree needs preparing before make, configure.ac with ./bootstrap, or the `prepare` key in .github/repo-infra.json.
# Pieces: container-make
# Call:
#   container:
#     uses: oposs/repo-infra/.github/workflows/ri-ci-container.yml@v2
#     with:
#       ref: ${{ inputs.ref }}

name: Container

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to check out; empty takes the commit that triggered the run (D28).
        type: string
        required: false
        default: ''
      repository:
        description: The repository to check out; the calling repository unless set (D33).
        type: string
        required: false
        default: ${{ github.repository }}
      directory:
        description: The directory that holds the Makefile; the top level unless set.
        type: string
        required: false
        default: .
      timeout_minutes:
        description: How long the job may run before it is cancelled.
        type: number
        required: false
        default: 60

permissions:
  contents: read

jobs:
  container:
    name: make check in the container
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}

      # The preparation step of ri-ci-man (D39): the `prepare` key, or
      # ./bootstrap and ./configure for a tree with configure.ac. A test pins
      # the copies equal.
      - name: Prepare the tree (D39)
        env:
          DIRECTORY: ${{ inputs.directory }}
        run: |
          prepare=''
          if [ -f .github/repo-infra.json ]; then
            prepare=$(jq -r '.prepare | if . == null then empty
              elif type == "string" then select(test("\\S"))
              else error("prepare must be a string") end' .github/repo-infra.json)
          fi
          cd "$DIRECTORY"
          if [ -f configure.ac ]; then
          sudo apt-get update
          sudo apt-get install -y autoconf automake gettext podman
          prepare=${prepare:-./bootstrap && ./configure}
          fi
          if [ -z "$prepare" ]; then
            echo "No prepare key and no configure.ac: nothing to prepare."
            exit 0
          fi
          echo "Preparing the tree: $prepare"
          bash -e -c "$prepare"

      # Docker, not podman: the runner user is not in the kvm group, so a
      # rootless podman container cannot open /dev/kvm. Under docker the
      # container's root is real root and opens it without the group, with no
      # udev rule and no chmod.
      - name: Run make check in the container
        run: make -C "$DIRECTORY" check
        env:
          DIRECTORY: ${{ inputs.directory }}
          CONTAINER_ENGINE: docker
