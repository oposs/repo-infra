# repo-infra: ri-ci-python v1
#
# Purpose: Lint with ruff and run pytest.
# Choose: The repository has pyproject.toml.
# Supplies: pyproject.toml with the pytest pythonpath setting; requirements-dev.txt
#   for the test dependencies, when it exists.
# Call:
#   python:
#     uses: ./.github/workflows/ri-ci-python.yml
#     with:
#       ref: ${{ inputs.ref }}

name: Python

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to check out; empty takes the commit that triggered the run (D28).
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  ruff:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - run: pip install ruff

      - run: ruff check .

  pytest:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - run: pip install pytest

      # What a test suite needs to import is a toolchain concern, not an
      # infrastructure one (D15): the project declares it and this job only
      # honours the declaration. Same shape as ci-checkmk-plugin's step; a
      # repository with no such file gets a no-op.
      - name: Install the test dependencies the project declares
        run: |
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      # Import paths come from the pytest `pythonpath` setting, so this command
      # is the same in every python repository the standard installs into.
      - run: python3 -m pytest -q
