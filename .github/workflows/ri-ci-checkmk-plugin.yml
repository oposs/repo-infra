# repo-infra: ri-ci-checkmk-plugin v2
#
# Purpose: Lint, test and package a Checkmk plugin.
# Choose: The repository has .mkp-builder.ini.
# Supplies: Plugin code under local/, tests for pytest, .mkp-builder.ini;
#   requirements-dev.txt for the test dependencies, when it exists.
# Call:
#   checkmk:
#     uses: oposs/repo-infra/.github/workflows/ri-ci-checkmk-plugin.yml@v2
#     with:
#       ref: ${{ inputs.ref }}

name: Checkmk plugin

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to check out; empty takes the commit that triggered the run (D28).
        type: string
        required: false
        default: ''
      repository:
        description: The repository to check out; the calling repository unless set (D33).
        type: string
        required: false
        default: ${{ github.repository }}

permissions:
  contents: read

jobs:
  cmk-lint:
    name: Plugin lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}

      # Checkmk 2.3 runs plugin code on Python 3.12 (PYTHON_VERSION 3.12.13 in
      # its package_versions.bzl). On 3.11 an import 3.12 removed, such as
      # distutils or imp, passed here and failed on the site.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Pinned: an unpinned ruff takes each new release's rules, which could
      # turn every caller red at once with no change in the caller. The
      # version moves on purpose, after the callers pass it (#133).
      - run: pip install ruff==0.17.4

      # The whole repository, tests/ included: with `ruff check local/`
      # oposs/cmk-oposs_smart_error kept ISC004 and I001 findings in tests/
      # on a green main (#133). ruff honours the repository's own excludes.
      - run: ruff check .

  cmk-test:
    name: Plugin tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: pip install pytest

      # The Checkmk API a plugin imports is a toolchain concern, not an
      # infrastructure one (D15): the plugin declares how to obtain it and
      # this job only honours that declaration. The cmk-oposs-plugin skill is
      # what writes the declaration and the test harness beside it.
      - name: Install the dependencies the plugin declares
        run: |
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      - run: python3 -m pytest -q

  cmk-package:
    name: Package builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}

      # A build with a throwaway version. If the package cannot be assembled,
      # that is worth knowing on the pull request rather than at release time.
      - uses: oposs/mkp-builder@v2
        with:
          version: 0.0.0
          verbose: 'true'
