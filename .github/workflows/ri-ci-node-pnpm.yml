# repo-infra: ri-ci-node-pnpm v2
#
# Purpose: Install with pnpm, then check, test and build.
# Choose: package.json and pnpm-lock.yaml, and no other lockfile, at the top or in
#   one directory named by `directory`.
# Supplies: The package.json scripts check, test and build.
# Call:
#   node:
#     uses: oposs/repo-infra/.github/workflows/ri-ci-node-pnpm.yml@v2
#     with:
#       ref: ${{ inputs.ref }}

name: Node (pnpm)

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to check out; empty takes the commit that triggered the run (D28).
        type: string
        required: false
        default: ''
      repository:
        description: The repository to check out; the calling repository unless set (D33).
        type: string
        required: false
        default: ${{ github.repository }}
      directory:
        description: The directory that holds package.json and pnpm-lock.yaml, relative to the repository (#151).
        type: string
        required: false
        default: .

permissions:
  contents: read

jobs:
  node-pnpm-check:
    name: Node checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}

      # corepack provisions pnpm from the `packageManager` field in
      # package.json, and must run before setup-node so `cache: pnpm` finds it.
      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ inputs.directory }}/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm test

      - run: pnpm build
