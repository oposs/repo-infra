# The tests of the workflow library, run by repo-infra's own ci.yml. Not a
# piece since D33: consumers load the library from repo-infra's commit and
# carry no copy to test.

name: Workflow library

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to check out; empty takes the commit that triggered the run (D28).
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  lib:
    name: Workflow library tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The release logic is a library, so it is tested like one. Before this,
      # the changelog roller was a Perl program inside a YAML string whose only
      # test was cutting a release.
      - name: Run the workflow library tests
        run: node --test .github/workflows/lib/*.test.js
