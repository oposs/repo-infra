# repo-infra: ri-ci-perl-autotools v2
#
# Purpose: Bootstrap, configure, build and test an autotools Perl project.
# Choose: configure.ac and cpanfile.
# Supplies: ./bootstrap, configure, and the targets all and check.
# Call:
#   perl:
#     uses: oposs/repo-infra/.github/workflows/ri-ci-perl-autotools.yml@v2
#     with:
#       ref: ${{ inputs.ref }}

name: Perl (autotools)

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to check out; empty takes the commit that triggered the run (D28).
        type: string
        required: false
        default: ''
      repository:
        description: The repository to check out; the calling repository unless set (D33).
        type: string
        required: false
        default: ${{ github.repository }}

permissions:
  contents: read

jobs:
  perl-autotools:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}

      # The preparation step of ri-ci-man (D39): it installs the fixed host
      # toolchain and runs ./bootstrap and ./configure, or the `prepare` key
      # of .github/repo-infra.json when the project sets one. A test pins the
      # copies equal. The toolchain is enough to bootstrap, configure, and
      # drive a container. It is the same for every autotools project, which
      # is what makes it infrastructure. Deliberately no package list (D16).
      #
      # The same commands serve both kinds of autotools repository unchanged.
      # A containerized one configures into driver mode (D18), so `make` builds
      # its image and `make check` runs the suite inside it -- and `configure`
      # never probes the project's own dependencies on this runner. One that
      # stayed native has no Containerfile, does not call REPO_INFRA_CONTAINER,
      # and runs plain autotools here.
      - name: Prepare the tree (D39)
        env:
          DIRECTORY: .
        run: |
          prepare=''
          if [ -f .github/repo-infra.json ]; then
            prepare=$(jq -r '.prepare | if . == null then empty
              elif type == "string" then select(test("\\S"))
              else error("prepare must be a string") end' .github/repo-infra.json)
          fi
          cd "$DIRECTORY"
          if [ -f configure.ac ]; then
          sudo apt-get update
          sudo apt-get install -y autoconf automake gettext podman
          prepare=${prepare:-./bootstrap && ./configure}
          fi
          if [ -z "$prepare" ]; then
            echo "No prepare key and no configure.ac: nothing to prepare."
            exit 0
          fi
          echo "Preparing the tree: $prepare"
          bash -e -c "$prepare"

      - run: make

      # The seam (D15). `make check` is the contract, the target automake
      # generates and the GNU coding standards name (#100); whether the
      # project runs its suite natively or inside its own container is its
      # business, and m4/repo-infra-container.m4 and build/container.mk are
      # what repo-infra ships for the second case.
      - run: make check
