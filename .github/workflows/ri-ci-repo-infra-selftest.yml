# The container and pandoc tests of repo-infra's own pytest suite, run by
# repo-infra's own ci.yml. Not a piece since D33, like ri-ci-lib.yml: no other
# repository has these tests, and a piece would freeze its interface until v3.

name: repo-infra self-test

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to check out; empty takes the commit that triggered the run (D28).
        type: string
        required: false
        default: ''
      repository:
        description: The repository to check out; the calling repository unless set (D33).
        type: string
        required: false
        default: ${{ github.repository }}

permissions:
  contents: read

jobs:
  repo-infra-selftest:
    name: Container self-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - run: pip install pytest

      # `-m container` filters *selection*, not *collection*: pytest imports
      # every module under tests/ before it decides which to run, so a test
      # file this job never runs can still stop it dead at import. That is how
      # this step came to exist -- the ordinary pytest job had the dependency
      # and this one did not, and the suite went from green to `1 error during
      # collection` on a file marked out of scope.
      - name: Install the test dependencies the project declares
        run: |
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      # The same fixed host toolchain `ci-perl-autotools` installs, and
      # deliberately the same string (D19). Podman on an Ubuntu runner is the
      # one link nothing else exercises, and this is the line that carries it.
      # A test pins the three blocks equal so they cannot drift apart silently.
      - name: Install the autotools host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake gettext podman

      # Only the container-marked tests. The ordinary `pytest` job already ran
      # everything else in under a second, and it did not need podman to do it.
      - run: python3 -m pytest -m container -v tests

  repo-infra-man:
    name: Man page toolchain tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - run: pip install pytest

      # pytest imports every module under tests/ before it selects any, so
      # this job needs the declared test dependencies like the one above.
      - name: Install the test dependencies the project declares
        run: |
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      # The toolchain ci-man installs, deliberately the same steps (D23): these
      # tests prove the build assets that block runs. A test pins them equal.
      - name: Install pandoc
        env:
          PANDOC_VERSION: 3.12.1
          PANDOC_SHA256: b4217ac7c54067c442f9d4cd38bcd0c184a43f3e7053431a12263a6f92a33ba2
        run: |
          deb="$RUNNER_TEMP/pandoc-$PANDOC_VERSION-1-amd64.deb"
          curl -fsSL --retry 5 -o "$deb" \
            "https://github.com/jgm/pandoc/releases/download/$PANDOC_VERSION/pandoc-$PANDOC_VERSION-1-amd64.deb"
          echo "$PANDOC_SHA256  $deb" | sha256sum -c -
          sudo dpkg -i "$deb"

      - name: Install man-db where the image lacks it
        run: |
          if ! dpkg-query -W -f '${Status}' man-db 2>/dev/null | grep -qx 'install ok installed'; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends man-db
          fi

      # Only the pandoc-marked tests. The ordinary pytest job deselects them,
      # since ci-python installs no pandoc. CI is set on the runner, so a
      # missing tool fails these tests instead of skipping them.
      - run: python3 -m pytest -m pandoc -v tests
