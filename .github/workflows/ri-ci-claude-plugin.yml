# repo-infra: ri-ci-claude-plugin v2
#
# Purpose: Check every .claude-plugin/plugin.json in the repository, and that
#   each entry of a root .claude-plugin/marketplace.json for this repository
#   points at one.
# Choose: The repository has .claude-plugin/plugin.json, at the root or in a
#   subdirectory.
# Supplies: One or more .claude-plugin/plugin.json; .claude-plugin/marketplace.json
#   at the root, when the repository is also a marketplace.
# Call:
#   plugin:
#     uses: oposs/repo-infra/.github/workflows/ri-ci-claude-plugin.yml@v2
#     with:
#       ref: ${{ inputs.ref }}

name: Claude plugin

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to check out; empty takes the commit that triggered the run (D28).
        type: string
        required: false
        default: ''
      repository:
        description: The repository to check out; the calling repository unless set (D33).
        type: string
        required: false
        default: ${{ github.repository }}

permissions:
  contents: read

jobs:
  plugin-manifest:
    name: Plugin manifest is valid
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}

      # The library of the commit this piece was loaded from (D33): repo-infra
      # at the release v2 points at, or the commit under test in repo-infra.
      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .repo-infra
          sparse-checkout: .github/workflows/lib

      # No dependency and no plugin CLI: a malformed plugin.json is a JSON
      # parse away, and the marketplace resolves a plugin's version by reading
      # exactly these fields over anonymous HTTPS. Only tracked files count,
      # so the library checkout above is never taken for a plugin.
      - name: Check every .claude-plugin/plugin.json
        uses: actions/github-script@v9
        env:
          REPOSITORY: ${{ inputs.repository }}
        with:
          script: |
            const fs = require('fs');
            const { execFileSync } = require('child_process');
            const ws = process.env.GITHUB_WORKSPACE;
            const { pluginProblems } = require(`${ws}/.repo-infra/.github/workflows/lib/plugin.js`);
            const files = execFileSync('git', ['ls-files', '-z'], { cwd: ws, encoding: 'utf8' })
              .split('\0').filter(Boolean);
            const { checked, problems } = pluginProblems({
              files,
              read: (file) => fs.readFileSync(`${ws}/${file}`, 'utf8'),
              repository: process.env.REPOSITORY,
            });
            for (const file of checked) core.notice(`checked ${file}`);
            if (problems.length > 0) core.setFailed(problems.join('\n'));
