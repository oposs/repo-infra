# repo-infra: ri-ci-perl-mkpl v2
#
# Purpose: Build the vendored dependencies and test a Makefile.PL project on three Perl versions.
# Choose: Makefile.PL and no configure.ac.
# Supplies: Makefile.PL and the targets thirdparty and test; when the tree needs preparing before make, the `prepare` key in .github/repo-infra.json.
# Call:
#   perl:
#     uses: oposs/repo-infra/.github/workflows/ri-ci-perl-mkpl.yml@v2
#     with:
#       ref: ${{ inputs.ref }}

name: Perl (Makefile.PL)

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to check out; empty takes the commit that triggered the run (D28).
        type: string
        required: false
        default: ''
      repository:
        description: The repository to check out; the calling repository unless set (D33).
        type: string
        required: false
        default: ${{ github.repository }}

permissions:
  contents: read

jobs:
  perl-mkpl:
    name: Perl ${{ matrix.perl }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        perl: ['5.40', '5.36', '5.32']
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}

      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}

      - uses: actions/cache@v6
        with:
          path: thirdparty
          key: cpan-${{ matrix.perl }}-${{ hashFiles('Makefile.PL') }}

      - run: perl Makefile.PL

      # The preparation step of ri-ci-man (D39): the `prepare` key, or
      # ./bootstrap and ./configure for a tree with configure.ac. A test pins
      # the copies equal.
      - name: Prepare the tree (D39)
        env:
          DIRECTORY: .
        run: |
          prepare=''
          if [ -f .github/repo-infra.json ]; then
            prepare=$(jq -r '.prepare | if . == null then empty
              elif type == "string" then select(test("\\S"))
              else error("prepare must be a string") end' .github/repo-infra.json)
          fi
          cd "$DIRECTORY"
          if [ -f configure.ac ]; then
          sudo apt-get update
          sudo apt-get install -y autoconf automake gettext podman
          prepare=${prepare:-./bootstrap && ./configure}
          fi
          if [ -z "$prepare" ]; then
            echo "No prepare key and no configure.ac: nothing to prepare."
            exit 0
          fi
          echo "Preparing the tree: $prepare"
          bash -e -c "$prepare"

      # A failed dependency build says nothing useful on stdout; the log is the
      # only place the actual error appears.
      - name: Build the vendored dependencies
        run: |
          if make thirdparty; then
            :
          else
            cat thirdparty/work/*/build.log
            exit 1
          fi

      - run: make test

      - name: Prepare the cache
        run: rm -f thirdparty/Makefile* && rm -rf thirdparty/work
