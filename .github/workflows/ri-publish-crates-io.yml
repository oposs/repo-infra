# repo-infra: ri-publish-crates-io v2
#
# Purpose: Publish the crate to crates.io with trusted publishing.
# Choose: The crate is published on crates.io.
# Supplies: The trusted publisher configured on crates.io for this workflow, for
#   every crate. A crate new to crates.io is published once by hand first.
# Call:
#   crates:
#     needs: [publish]
#     if: needs.publish.outputs.release_id != ''
#     uses: oposs/repo-infra/.github/workflows/ri-publish-crates-io.yml@v2
#     permissions:
#       contents: read
#       id-token: write
#     with:
#       head: ${{ needs.publish.outputs.head }}

name: Publish to crates.io

on:
  workflow_call:
    inputs:
      head:
        description: The commit the release was built from, from ri-publish-tag.
        type: string
        required: true

permissions:
  contents: read

jobs:
  publish-crates-io:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    # Room for the publish loop below: up to three waits of five minutes on
    # top of the uploads themselves.
    timeout-minutes: 60
    # Trusted Publishing (D21): the job's OIDC identity is exchanged for a
    # short-lived crates.io token, so no repository holds a CRATES_IO_TOKEN.
    # `id-token: write` is what mints that identity -- without it the exchange
    # below fails. `contents: read` is all the job needs.
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_TERM_COLOR: always
    steps:
      # The commit `publish` tagged: the head the release pull request built
      # (D26). Its Cargo.toml and Cargo.lock carry the bumped version: the
      # release pull request rewrites both through version_files (D28).
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head }}

      # @stable, matching ci-rust. The action publishes no floating major tag;
      # `stable` is its documented channel selector.
      - uses: dtolnay/rust-toolchain@stable

      # crates.io pins a Trusted Publisher to a (repository, workflow filename)
      # pair. The filename half is `release-publish.yml` for every repository
      # the standard converts -- but a repository that published before it was
      # converted has its publisher registered against whatever its old
      # workflow was called, and that pin does NOT follow the rename. Register
      # a new one per crate before the first converted release.
      - name: Authenticate to crates.io (Trusted Publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      # One step asks crates.io what is missing and publishes it, in a loop.
      #
      # A whole-workflow re-run repeats this job after a first attempt that
      # already uploaded some or all crates, and `cargo publish` refuses a
      # version crates.io already has. So every attempt asks crates.io first
      # and excludes what is there. `publish = false` shows as an empty list
      # in the metadata; such a crate is never asked about.
      #
      # --workspace publishes every publishable member in dependency order, so
      # the standard needs no per-crate list and no ordering configuration. A
      # helper crate opts out with `publish = false` in its own manifest.
      # cargo waits for each uploaded crate to reach the index before it
      # uploads the crates that depend on it, but that wait has a fixed limit:
      # shadcn-egui v0.5.0 (33 crates on one base crate) failed with "timed
      # out waiting for shadcn-egui-core v0.5.0 to be available", and "Re-run
      # failed jobs" then published the other 32. The loop does that re-run
      # itself. It also waits out crates.io's rate limit on new versions
      # (HTTP 429), which a workspace of many crates can reach in one run.
      # Any other failure stops the job at once.
      #
      # Trusted Publishing cannot create a crate: crates.io lets a publisher
      # be registered only for a crate that exists. A crate crates.io has
      # never seen therefore stops the job before anything is uploaded, with
      # the steps that get it there (#86).
      #
      # --locked guards every pin in Cargo.lock: the release pull request
      # bumped the workspace's own entries, and nothing here re-resolves.
      - name: Publish the crates crates.io does not have yet
        id: publish
        run: |
          set -euo pipefail
          agent='repo-infra publish-crates-io (https://github.com/oposs/repo-infra)'
          crates=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.publish != []) | "\(.name) \(.version)"')

          # Prints the HTTP status crates.io answers for a crate or a version.
          ask() {
            curl -sS -o /dev/null -w '%{http_code}' -A "$agent" \
              "https://crates.io/api/v1/crates/$1"
          }
          known() {
            case "$2" in
              200|404) ;;
              *) echo "crates.io answered HTTP $2 for $1" >&2; exit 1 ;;
            esac
          }

          # Sets exclude and pending.
          find_pending() {
            exclude=()
            pending=0
            local new=() name version status
            while read -r name version; do
              [ -n "$name" ] || continue
              status=$(ask "${name}/${version}")
              known "${name} ${version}" "$status"
              if [ "$status" = 200 ]; then
                echo "::notice::${name} ${version} is already on crates.io - not publishing it again."
                exclude+=(--exclude "$name")
                continue
              fi
              pending=$((pending + 1))
              status=$(ask "$name")
              known "$name" "$status"
              [ "$status" = 200 ] || new+=("$name")
            done <<< "$crates"
            if [ "${#new[@]}" -gt 0 ]; then
              for name in "${new[@]}"; do
                echo "::error::${name} is not on crates.io yet, and Trusted Publishing cannot create a crate."
              done
              echo "Publish this release once by hand with a crates.io API token" \
                "(cargo publish --workspace --locked on the release commit)," \
                "register .github/workflows/release-publish.yml as the Trusted Publisher" \
                "of ${new[*]}, then re-run the failed jobs." >&2
              exit 1
            fi
          }

          attempts=4
          log="${RUNNER_TEMP}/cargo-publish.log"
          for attempt in $(seq "$attempts"); do
            find_pending
            if [ "$pending" -eq 0 ]; then
              echo "::notice::Every crate of this release is already on crates.io."
              exit 0
            fi
            if cargo publish --workspace --locked "${exclude[@]}" 2>&1 | tee "$log"; then
              exit 0
            fi
            case "$(cat "$log")" in
              *"status 429"*) wait=300 ;;
              *"timed out waiting for"*|*"timeout while waiting for published dependencies"*|\
              *"failed to select a version for the requirement"*|*"no matching package named"*)
                wait=60 ;;
              *) exit 1 ;;
            esac
            if [ "$attempt" -eq "$attempts" ]; then
              echo "::error::crates.io did not take the release after ${attempts} attempts."
              exit 1
            fi
            echo "::warning::crates.io is not ready; publishing what it does not have yet in ${wait}s (attempt $((attempt + 1)) of ${attempts})."
            sleep "$wait"
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      # Nothing is attached to the draft release and there is no summary step:
      # the job publishes to an external registry, and `cargo publish` already
      # names every crate and version it uploaded. The caller lists this job in
      # the `needs:` of ri-publish-finalize, so if it fails the release stays a
      # draft and a version is never visible on GitHub while absent from
      # crates.io.
