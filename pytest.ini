[pytest]
testpaths = tests
pythonpath = tests skills/repo-infra/scripts
markers =
    container: exercises the shipped assets against a real container; needs podman and takes minutes (D19)
    pandoc: needs pandoc (and make, man); deselected from the plain pytest run ci-python makes, run by `make test` and by the repo-infra-man job (D23)
# The temporary files of a bare `python3 -m pytest` go to .pytest-tmp in the
# checkout, as with `make test`, not to /tmp/pytest-of-<user>.
addopts = -m "not container and not pandoc" --basetemp=.pytest-tmp
