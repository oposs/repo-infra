[pytest]
testpaths = tests
pythonpath = skills/repo-infra/scripts
markers =
    container: exercises the shipped assets against a real container; needs podman and takes minutes (D19)
    pandoc: needs pandoc (and make, man); deselected from the plain pytest run ci-python makes, run by `make test` and by the repo-infra-man job (D23)
addopts = -m "not container and not pandoc"
