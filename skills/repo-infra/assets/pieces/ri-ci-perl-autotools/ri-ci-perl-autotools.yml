# repo-infra: ri-ci-perl-autotools v1
#
# Purpose: Bootstrap, configure, build and test an autotools Perl project.
# Choose: configure.ac.
# Supplies: ./bootstrap, configure, and the targets all and test.
# Call:
#   perl:
#     uses: ./.github/workflows/ri-ci-perl-autotools.yml
#     with:
#       ref: ${{ inputs.ref }}

name: Perl (autotools)

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to check out; empty takes the commit that triggered the run (D28).
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  perl-autotools:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # The fixed host toolchain: enough to bootstrap, configure, and drive a
      # container. It is the same for every autotools project, which is what
      # makes it infrastructure. Deliberately no package list (D16).
      #
      # These four commands serve both kinds of autotools repository unchanged.
      # A containerized one configures into driver mode (D18), so `make` builds
      # its image and `make test` runs the suite inside it -- and `configure`
      # never probes the project's own dependencies on this runner. One that
      # stayed native has no Containerfile, does not call REPO_INFRA_CONTAINER,
      # and runs plain autotools here.
      - name: Install the autotools host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake gettext podman

      - run: ./bootstrap

      - run: ./configure --prefix=$HOME/test-install

      - run: make

      # The seam (D15). `make test` is the contract; whether the project runs
      # its suite natively or inside its own container is its business, and
      # m4/repo-infra-container.m4 and build/container.mk are what repo-infra
      # ships for the second case.
      - run: make test
