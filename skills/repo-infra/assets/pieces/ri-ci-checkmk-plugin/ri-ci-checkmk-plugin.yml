# repo-infra: ri-ci-checkmk-plugin v1
#
# Purpose: Lint, test and package a Checkmk plugin.
# Choose: The repository has .mkp-builder.ini.
# Supplies: Plugin code under local/, tests for pytest, .mkp-builder.ini.
# Call:
#   checkmk:
#     uses: ./.github/workflows/ri-ci-checkmk-plugin.yml
#     with:
#       ref: ${{ inputs.ref }}

name: Checkmk plugin

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to check out; empty takes the commit that triggered the run (D28).
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  cmk-lint:
    name: Plugin lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - run: pip install ruff

      - run: ruff check local/

  cmk-test:
    name: Plugin tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - run: pip install pytest

      # The Checkmk API a plugin imports is a toolchain concern, not an
      # infrastructure one (D15): the plugin declares how to obtain it and
      # this job only honours that declaration. The cmk-oposs-plugin skill is
      # what writes the declaration and the test harness beside it.
      - name: Install the dependencies the plugin declares
        run: |
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      - run: python3 -m pytest -q

  cmk-package:
    name: Package builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # A build with a throwaway version. If the package cannot be assembled,
      # that is worth knowing on the pull request rather than at release time.
      - uses: oposs/mkp-builder@v2
        with:
          version: 0.0.0
          verbose: 'true'
