  perl-autotools:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # The fixed host toolchain: enough to bootstrap, configure, and drive a
      # container. It is the same for every autotools project, which is what
      # makes it infrastructure. Deliberately no package list (D16): a project
      # needing more than this list is the next teach, not a place to add one.
      #
      # Known limit: only `make test` below can reach a container. `bootstrap`,
      # `configure` and `make` still run on this bare runner, so a project that
      # cannot configure without its own system packages has hit the D16
      # threshold here too. There is also no way to pass `configure` flags, so
      # a project's own escape hatch for this (SmokePing's `--enable-pkgonly`,
      # which skips exactly this check) is unreachable from the standard.
      - name: Install the autotools host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake gettext podman

      - run: ./bootstrap

      - run: ./configure --prefix=$HOME/test-install

      - run: make

      # The seam (D15). `make test` is the contract; whether the project runs
      # its suite natively or inside its own container is its business, and
      # build/container-test.mk is what repo-infra ships for the second case.
      - run: make test
