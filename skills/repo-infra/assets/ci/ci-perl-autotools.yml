  perl-autotools:
    name: Perl ${{ matrix.perl }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        perl: ['5.40', '5.36', '5.32']
    steps:
      - uses: actions/checkout@v7

      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}

      - uses: actions/cache@v6
        with:
          path: thirdparty
          key: cpan-${{ matrix.perl }}-${{ hashFiles('**/cpanfile') }}

      - run: ./bootstrap

      - run: ./configure --prefix=$HOME/test-install

      - run: make

      - run: make test

      # The cache is written after the job, so strip the generated build files
      # first: restoring them stale into the next run breaks it in ways that
      # look like a dependency problem.
      - name: Prepare the cache
        run: rm -f thirdparty/Makefile* && rm -rf thirdparty/work
