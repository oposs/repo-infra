  node-pnpm-check:
    name: Node checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # corepack provisions pnpm from the `packageManager` field in
      # package.json, and must run before setup-node so `cache: pnpm` finds it.
      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm test

      - run: pnpm build
