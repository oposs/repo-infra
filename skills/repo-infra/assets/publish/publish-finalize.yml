  finalize:
    name: Publish the release
    # Generated by the assembler: `publish`, then every add-on job installed in
    # this repository, then every job named in `publish_local` in
    # .github/repo-infra.json. An add-on that fails leaves the release a draft,
    # which is the correct outcome -- a release missing its artifacts must not
    # be visible.
    #
    # This line is GENERATED, including the repository's own publish jobs. Do
    # not hand-edit it: a hand edit is reverted by the next `apply`, and the
    # revert does not fail -- it just stops waiting. Declare the job in
    # `publish_local` instead. The asset check in the step below is what makes
    # a lost entry loud rather than silent.
    needs: []
    if: needs.publish.outputs.release_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # For .github/workflows/lib/assets.js, below.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/github-script@v9
        with:
          script: |
            const lib = `${process.env.GITHUB_WORKSPACE}/.github/workflows/lib`;
            const assetsLib = require(`${lib}/assets.js`);

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const release_id = Number('${{ needs.publish.outputs.release_id }}');

            // Generated from the manifest entry of every installed publish
            // block plus the `assets` of every `publish_local` entry -- by the
            // assembler, from the same declarations the `needs:` list above
            // comes from. Never a literal typed a second time by hand.
            const expected = [];

            // The `needs:` list above is ordering, and ordering cannot report
            // its own absence: reverted, it does not fail, it stops waiting.
            // So ask the release what it actually carries. This assertion
            // cannot pass while being wrong -- an asset is on the release or
            // it is not -- which is the whole difference between a quietly
            // empty release and a red job.
            const attached = await github.paginate(
              github.rest.repos.listReleaseAssets,
              { owner, repo, release_id, per_page: 100 },
            );
            const names = attached.map((a) => a.name);
            const missing = assetsLib.missingAssets(names, expected);
            if (missing.length > 0) {
              core.setFailed(
                `${{ needs.publish.outputs.tag }} is missing ${missing.join(', ')}`
                + ` -- it stays a draft. Attached: ${names.join(', ') || 'nothing'}.`
                + ` Either a publish job did not run (compare finalize's needs:`
                + ` list with the jobs in this workflow) or it attached`
                + ` something under another name (see publish_local in`
                + ` .github/repo-infra.json).`
              );
              return;
            }

            const { data: released } = await github.rest.repos.updateRelease({
              owner, repo, release_id, draft: false,
            });
            core.notice(`Published ${released.html_url}`);
            await core.summary
              .addHeading(`Released ${{ needs.publish.outputs.tag }}`)
              .addRaw(`Assets: ${names.join(', ') || 'none'}`)
              .addLink('Release', released.html_url)
              .write();
